---
- name: Bootstrap managed nodes for config drift detection
  hosts: all
  become: true
  gather_facts: true

  vars:
    splunk_uf_rpm: "{{ lookup('env', 'SPLUNK_UF_RPM') | default('', true) }}"
    splunk_cloud_creds: "{{ lookup('env', 'SPLUNK_CLOUD_CREDS_PACKAGE') | default('', true) }}"
    splunk_admin_password: "{{ lookup('env', 'SPLUNK_UF_ADMIN_PASSWORD') | default('Splunk4ward!', true) }}"
    auditd_log_format: ENRICHED

  tasks:
    # ── Time sync ──────────────────────────────────────────────────────
    - name: Ensure chronyd is installed and running
      ansible.builtin.dnf:
        name: chrony
        state: present

    - name: Enable and start chronyd
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    # ── auditd setup ──────────────────────────────────────────────────
    - name: Ensure auditd is installed
      ansible.builtin.dnf:
        name:
          - audit
          - audit-libs
        state: present

    - name: Set log_format to ENRICHED for Splunk CIM uid→user resolution
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^log_format\s*='
        line: "log_format = {{ auditd_log_format }}"
        backup: true
      notify: Restart auditd

    - name: Deploy drift detection audit rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../auditd/50-drift.rules"
        dest: /etc/audit/rules.d/50-drift.rules
        owner: root
        group: root
        mode: '0640'
      notify: Reload audit rules

    - name: Ensure auditd is enabled and running
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

    # ── Splunk Universal Forwarder ────────────────────────────────────
    - name: Check if Splunk UF is already installed
      ansible.builtin.stat:
        path: /opt/splunkforwarder/bin/splunk
      register: uf_binary

    - name: Install Splunk UF
      when:
        - splunk_uf_rpm | length > 0
        - not uf_binary.stat.exists
      block:
        - name: Copy Splunk UF RPM to node
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ splunk_uf_rpm }}"
            dest: /tmp/splunkforwarder.rpm
            mode: '0644'

        - name: Install Splunk UF RPM
          ansible.builtin.dnf:
            name: /tmp/splunkforwarder.rpm
            state: present
            disable_gpg_check: true

        - name: Accept license and set admin password
          ansible.builtin.command:
            cmd: >
              /opt/splunkforwarder/bin/splunk start
              --accept-license --no-prompt --answer-yes
              --seed-passwd {{ splunk_admin_password }}
            creates: /opt/splunkforwarder/var/run/splunk/splunkd.pid

        - name: Enable boot-start (systemd)
          ansible.builtin.command:
            cmd: /opt/splunkforwarder/bin/splunk enable boot-start -systemd-managed 1
          changed_when: true

        - name: Clean up RPM
          ansible.builtin.file:
            path: /tmp/splunkforwarder.rpm
            state: absent

    - name: Deploy UF inputs.conf for auditd logs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../splunk/inputs.conf.j2"
        dest: /opt/splunkforwarder/etc/system/local/inputs.conf
        owner: splunkfwd
        group: splunkfwd
        mode: '0600'
      when: uf_binary.stat.exists or splunk_uf_rpm | length > 0
      notify: Restart Splunk UF

    # ── Splunk Cloud credentials package ──────────────────────────────
    - name: Install Splunk Cloud credentials package
      when:
        - splunk_cloud_creds | length > 0
        - uf_binary.stat.exists or splunk_uf_rpm | length > 0
      block:
        - name: Copy credentials package to node
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ splunk_cloud_creds }}"
            dest: /tmp/splunkclouduf.spl
            mode: '0600'

        - name: Install credentials package
          ansible.builtin.command:
            cmd: >
              /opt/splunkforwarder/bin/splunk install app /tmp/splunkclouduf.spl
              -auth admin:{{ splunk_admin_password }}
          register: creds_result
          changed_when: "'already installed' not in creds_result.stdout"
          failed_when:
            - creds_result.rc != 0
            - "'already installed' not in creds_result.stdout"
          notify: Restart Splunk UF

        - name: Clean up credentials package
          ansible.builtin.file:
            path: /tmp/splunkclouduf.spl
            state: absent

  handlers:
    - name: Restart auditd
      ansible.builtin.service:
        name: auditd
        state: restarted

    - name: Reload audit rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: true

    - name: Restart Splunk UF
      ansible.builtin.service:
        name: SplunkForwarder
        state: restarted
