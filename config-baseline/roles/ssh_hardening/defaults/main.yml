---
# Declarative desired state for SSH configuration.
# This is the catalog equivalent — a Puppet manifest, but in YAML.
# Override per group/host via group_vars or host_vars.

desired_sshd:
  Port: 22
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PubkeyAuthentication: "yes"
  X11Forwarding: "no"
  ClientAliveInterval: 300
  ClientAliveCountMax: 2
  MaxAuthTries: 3
  LogLevel: VERBOSE
  AllowGroups: "ssh-users wheel"

sshd_config_path: /etc/ssh/sshd_config
sshd_backup_dir: /etc/ssh
