---
backup_dir: /var/lib/config-baseline/backups

# Each managed file is defined as a list item. Add new files here to extend
# the baseline — no changes needed to the rulebook or EDA config.
managed_files:
  - name: sshd_config
    dest: /etc/ssh/sshd_config
    template: sshd_config.j2
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
    restart_service: sshd

  - name: chrony.conf
    dest: /etc/chrony.conf
    template: chrony.conf.j2
    owner: root
    group: root
    mode: "0644"
    restart_service: chronyd

# Desired state for sshd_config — override per host/group via host_vars.
desired_sshd:
  Port: 22
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PubkeyAuthentication: "yes"
  AuthorizedKeysFile: ".ssh/authorized_keys"
  UsePAM: "yes"
  X11Forwarding: "no"
  ClientAliveInterval: 300
  ClientAliveCountMax: 2
  MaxAuthTries: 3
  LogLevel: VERBOSE
  AllowGroups: "ssh-users wheel ec2-user"

# Desired state for chrony.conf — override per host/group via host_vars.
desired_ntp_servers:
  - 169.254.169.123    # AWS Time Sync (preferred in EC2)
  - 0.rhel.pool.ntp.org
  - 1.rhel.pool.ntp.org
  - 2.rhel.pool.ntp.org

chrony_settings:
  makestep: "1.0 3"
  rtcsync: true
  logdir: /var/log/chrony
