---
- name: Show remediation context
  ansible.builtin.debug:
    msg: >
      Config baseline enforcement on {{ inventory_hostname }}.
      Trigger: {{ drift_key | default('manual') }} by auid={{ triggering_user | default('n/a') }}.
      Splunk: {{ splunk_results_link | default('n/a') }}

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Enforce managed files
  ansible.builtin.include_tasks: enforce_file.yml
  loop: "{{ managed_files }}"
  loop_control:
    loop_var: managed_file
    label: "{{ managed_file.name }}"

- name: Report remediation outcome to Splunk HEC
  ansible.builtin.uri:
    url: "{{ splunk_hec_url }}"
    method: POST
    headers:
      Authorization: "Splunk {{ splunk_hec_token }}"
    body_format: json
    body:
      sourcetype: "ansible:remediation"
      event:
        host: "{{ inventory_hostname }}"
        drift_key: "{{ drift_key | default('manual') }}"
        triggered_by: "{{ triggering_user | default('manual') }}"
        splunk_sid: "{{ splunk_sid | default('') }}"
        aap_job_id: "{{ awx_job_id | default('local') }}"
        action: "{{ drift_action | default('remediate') }}"
        result: success
        files_enforced: "{{ managed_files | map(attribute='name') | list }}"
    validate_certs: true
  run_once: true
  no_log: false
  ignore_errors: true
  when: splunk_hec_url is defined
