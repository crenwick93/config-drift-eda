---
- name: Show remediation context
  ansible.builtin.debug:
    msg: >
      Config baseline enforcement on {{ inventory_hostname }}.
      Trigger: {{ drift_key | default('manual') }} by auid={{ triggering_user | default('n/a') }}.
      Splunk: {{ splunk_results_link | default('n/a') }}

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Enforce managed files
  ansible.builtin.include_tasks: enforce_file.yml
  loop: "{{ managed_files }}"
  loop_control:
    loop_var: managed_file
    label: "{{ managed_file.name }}"

