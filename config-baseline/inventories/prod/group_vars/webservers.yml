---
# Role-specific overrides for webservers.
# Inherits from all.yml, overrides only what differs.

desired_sshd:
  Port: 22
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PubkeyAuthentication: "yes"
  X11Forwarding: "no"
  ClientAliveInterval: 120
  ClientAliveCountMax: 3
  MaxAuthTries: 3
  LogLevel: VERBOSE
  AllowGroups: "ssh-users wheel webadmins"
