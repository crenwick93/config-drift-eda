---
- name: Config drift remediation listener
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001
  rules:
    - name: SSH config drift detected
      condition: event.payload.result.key == "ssh_config_change"
      throttle:
        once_within: 2 minutes
        group_by_attributes:
          - event.payload.result.host
      action:
        run_workflow_template:
          name: Remediate SSH Config Drift
          organization: config-drift-demo
          job_args:
            limit: "{{ event.payload.result.host }}"
            extra_vars:
              drift_key: "{{ event.payload.result.key }}"
              triggering_user: "{{ event.payload.result.triggering_user | default('unknown') }}"
              splunk_sid: "{{ event.payload.sid | default('') }}"
              splunk_results_link: "{{ event.payload.results_link | default('') }}"
              remediated_host: "{{ event.payload.result.host }}"
              remediated_file: "/etc/ssh/sshd_config"

    - name: Sudoers drift detected
      condition: event.payload.result.key == "sudoers_change"
      throttle:
        once_within: 2 minutes
        group_by_attributes:
          - event.payload.result.host
      action:
        run_workflow_template:
          name: Remediate Sudoers (with approval)
          organization: config-drift-demo
          job_args:
            limit: "{{ event.payload.result.host }}"
