---
- name: Config drift remediation listener
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001
  rules:
    - name: Config drift detected
      condition: >-
        event.payload.result.drift_key is defined and
        "config_drift" in event.payload.result.drift_key
      throttle:
        once_within: 2 minutes
        group_by_attributes:
          - event.payload.result.host
      action:
        run_workflow_template:
          name: Remediate Config Drift
          organization: config-drift-demo
          job_args:
            limit: "{{ event.payload.result.host }}"
            extra_vars:
              drift_key: "{{ event.payload.result.drift_key | default('config_drift') }}"
              triggering_user: "{{ event.payload.result.auid | default('unknown') }}"
              splunk_sid: "{{ event.payload.sid | default('') }}"
              splunk_results_link: "{{ event.payload.results_link | default('') }}"
              remediated_host: "{{ event.payload.result.host }}"
